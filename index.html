<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polisportiva A.V.I. Vipiteno – Scuola Nuoto Federale FIN</title>
<meta name="description" content="Corsi di nuoto per bebè, bambini e adulti, acquafitness e squadra agonistica al Balneum di Vipiteno. Prenota online in italiano, tedesco e inglese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10243A; --ink-2:#34495E; --muted:#56697B; --bg:#F4F8FA; --surface:#FFFFFF; --deck:#E7F0F5; --line:#D3E0E8;
  --pool:#17719F; --pool-deep:#0E5682; --shallow:#9ED8EC; --red:#D7263D; --yellow:#F6C324; --ok:#1F8A5B;
  --on-pool:#FFFFFF; --focus:#F6C324;
  --fd:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --wrap:1180px; --gut:clamp(16px,4vw,40px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E4EEF5; --ink-2:#BFD0DD; --muted:#93A8B9; --bg:#0A1826; --surface:#102336; --deck:#0D1F31; --line:#1E3850;
    --pool:#135F87; --pool-deep:#0B4566; --shallow:#5DB4D4;
  }
}
:root[data-theme="dark"]{
  --ink:#E4EEF5; --ink-2:#BFD0DD; --muted:#93A8B9; --bg:#0A1826; --surface:#102336; --deck:#0D1F31; --line:#1E3850;
  --pool:#135F87; --pool-deep:#0B4566; --shallow:#5DB4D4;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:1.0625rem;line-height:1.55}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gut)}
.skip{position:absolute;left:-999px;top:8px;background:var(--yellow);color:#10243A;padding:8px 12px;z-index:100;border-radius:6px}
.skip:focus{left:8px}
h1,h2,.display{font-family:var(--fd);font-weight:900;line-height:.92;letter-spacing:.004em;margin:0}
h2{font-weight:800;font-size:clamp(2.2rem,5.2vw,3.5rem)}
h3{font-size:1.2rem;font-weight:600;margin:0 0 .3em;line-height:1.3}
p{margin:0 0 1em;max-width:66ch}
.lead{font-size:clamp(1.08rem,1.6vw,1.25rem);color:var(--ink-2);max-width:58ch}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.sec-head p{margin:.6em 0 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:2px solid transparent;font-weight:600;text-decoration:none;cursor:pointer;background:none;line-height:1.1;white-space:nowrap}
.btn-go{background:var(--yellow);color:#10243A}
.btn-go:hover{background:#FFD54F}
.btn-line{border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--bg)}
.btn-ghost{color:var(--ink);padding-inline:10px}
.btn-wait{background:transparent;border-color:var(--red);color:var(--red)}
.btn-wait:hover{background:var(--red);color:#fff}
.btn-sm{min-height:38px;padding:6px 14px;font-size:.95rem}
.link{font-weight:600;text-underline-offset:3px}

/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand-t{font-family:var(--fd);font-weight:800;font-size:1.45rem;line-height:.9}
.brand-t small{display:block;font-family:var(--fb);font-weight:500;font-size:.72rem;letter-spacing:.01em;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{white-space:nowrap;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:500;font-size:.98rem;color:var(--ink-2)}
.nav a:hover{background:var(--deck);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}
.langs{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;flex-shrink:0}
.langs button{border:0;background:none;padding:5px 9px;border-radius:999px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted);min-width:36px;min-height:32px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none;margin-left:auto;border:0;background:none;padding:8px;cursor:pointer;min-width:44px;min-height:44px}
@media (max-width:1060px){.nav,.top .btn-go,.top .fam{display:none}.menu-btn{display:inline-flex;align-items:center;justify-content:center}.langs{margin-left:auto}.menu-btn{margin-left:4px}}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 24px);display:none;flex-direction:column;overflow:auto}
.sheet.open{display:flex}
.sheet-top{display:flex;justify-content:space-between;align-items:center;height:56px}
.sheet nav a{display:block;font-family:var(--fd);font-weight:800;font-size:2.3rem;padding:8px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.sheet .btn{margin-top:20px;width:100%}

/* hero: the pool */
.deck{background:var(--deck);padding-top:clamp(36px,6vw,72px);padding-bottom:28px}
.hero-h{font-size:clamp(3.1rem,10.5vw,7.6rem);max-width:12ch}
.hero-sub{margin-top:22px}
.pool{position:relative;background:var(--pool);color:var(--on-pool);overflow:hidden;isolation:isolate}
.pool::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;
  background:
   radial-gradient(60% 40% at 18% 30%,rgba(158,216,236,.35),transparent 70%),
   radial-gradient(50% 50% at 80% 70%,rgba(158,216,236,.25),transparent 70%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 26px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 26px)}
.pool-cap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;font-size:.95rem;color:rgba(255,255,255,.86)}
.rope{height:10px;position:relative;
  background:
   radial-gradient(circle at 7px 5px,var(--red) 0 4.4px,transparent 5px) 0 0/28px 10px repeat-x,
   radial-gradient(circle at 21px 5px,var(--yellow) 0 4.4px,transparent 5px) 0 0/28px 10px repeat-x,
   linear-gradient(transparent 4px,rgba(255,255,255,.55) 4px 6px,transparent 6px);
  transform-origin:left center}
.lanes{list-style:none;margin:0;padding:0}
.lane{position:relative}
.lane a{display:grid;grid-template-columns:clamp(46px,7vw,84px) 1fr auto;align-items:center;gap:clamp(10px,2vw,24px);padding:clamp(14px,2.4vw,22px) 0;text-decoration:none;color:inherit;position:relative}
.lane a::after{content:"";position:absolute;left:52%;right:3%;top:50%;height:7px;margin-top:-3px;background:rgba(6,32,52,.32);border-radius:2px;z-index:-1}
.lane a::before{content:"";position:absolute;right:3%;top:50%;width:7px;height:34px;margin-top:-17px;background:rgba(6,32,52,.32);border-radius:2px;z-index:-1}
.lane:nth-child(even){background:rgba(255,255,255,.035)}
.lane-n{font-family:var(--fd);font-weight:900;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1;color:rgba(255,255,255,.9);text-align:center}
.lane-t{font-family:var(--fd);font-weight:800;font-size:clamp(1.55rem,3.6vw,2.5rem);line-height:1}
.lane-m{display:block;font-family:var(--fb);font-weight:500;font-size:.95rem;color:rgba(255,255,255,.88);margin-top:6px;line-height:1.35}
.lane-go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);transition:background .2s,transform .2s}
.lane a:hover .lane-go,.lane a:focus-visible .lane-go{background:var(--yellow);color:#10243A;transform:translateX(3px)}
.lane a:hover .lane-t{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--yellow)}
@media (prefers-reduced-motion:no-preference){
  .pool.anim .rope{animation:stretch .9s cubic-bezier(.2,.8,.2,1) both}
  .pool.anim .lanes li:nth-child(2) + .rope,.pool.anim .rope:nth-of-type(2){animation-delay:.06s}
  @keyframes stretch{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
.facts-band{background:var(--surface);border-bottom:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.facts div{padding:22px clamp(12px,2vw,24px) 22px 0;border-right:1px solid var(--line);font-weight:500;line-height:1.35}
.facts div:last-child{border-right:0}
.facts div+div{padding-left:clamp(12px,2vw,24px)}
.facts b{display:block;font-family:var(--fd);font-weight:800;font-size:1.65rem;line-height:1;margin-bottom:6px;color:var(--pool-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .facts b{color:var(--shallow)}}
:root[data-theme="dark"] .facts b{color:var(--shallow)}
@media (max-width:820px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(2){border-right:0}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}.facts div:nth-child(3){padding-left:0}}
@media (max-width:700px){.lane a::after,.lane a::before{display:none}}
@media (max-width:520px){.brand-t small{display:none}.brand-t{font-size:1.2rem}.brand svg{width:34px;height:34px}.top-in{gap:8px}.langs button{min-width:30px;padding:4px 6px}.menu-btn{min-width:40px;padding:6px}}

/* heat sheet */
.heat{border-top:2px solid var(--ink)}
.heat-h,.heat-r{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1.25fr) minmax(0,.6fr) auto;gap:16px;align-items:center}
.heat-h{padding:10px 0;font-size:.85rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.heat-r{padding:16px 0;border-bottom:1px solid var(--line)}
.heat-r:hover{background:linear-gradient(90deg,transparent,var(--deck) 6%,var(--deck) 94%,transparent)}
.c-name{font-weight:600;line-height:1.3}
.c-name small{display:block;font-weight:500;color:var(--muted);font-size:.88rem;margin-top:2px}
.c-when b{font-family:var(--fd);font-weight:800;font-size:1.35rem;line-height:1;display:block}
.c-when span{font-size:.88rem;color:var(--muted)}
.c-price{font-family:var(--fd);font-weight:800;font-size:1.45rem}
.beads{display:flex;gap:3px;margin-bottom:5px}
.beads i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-2);display:block}
.beads i.f{background:var(--ink-2)}
.beads.full i{border-color:var(--red);background:var(--red)}
.spots{font-size:.88rem;font-weight:600}
.spots.low{color:var(--red)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--deck);color:var(--ink-2);vertical-align:middle}
@media (max-width:820px){
  .heat-h{display:none}
  .heat-r{grid-template-columns:1fr auto;grid-template-areas:"name price" "when when" "spots act";row-gap:10px}
  .heat-r .c-name{grid-area:name}.heat-r .c-when{grid-area:when;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .heat-r .c-age{display:none}.heat-r .c-spots{grid-area:spots}.heat-r .c-price{grid-area:price;text-align:right}.heat-r .c-act{grid-area:act}
}

/* filters */
.filters{display:flex;flex-direction:column;gap:14px;margin:8px 0 26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips-l{white-space:nowrap;flex-shrink:0;font-weight:600;font-size:.92rem;color:var(--muted);min-width:76px}
.chip{white-space:nowrap;flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.95rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}.chips-l{min-width:auto}}

/* scoreboard */
.board{background:#0B1C2C;color:#EAF3F8;border-radius:18px;overflow:hidden}
.board-r{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:clamp(14px,3vw,36px);padding:clamp(18px,3vw,28px) clamp(18px,3vw,32px);border-bottom:1px solid rgba(255,255,255,.08);align-items:center}
.board-r:last-child{border-bottom:0}
.time{font-family:var(--fd);font-weight:900;font-size:clamp(2.6rem,6vw,4rem);line-height:.9;color:var(--yellow);font-variant-numeric:tabular-nums}
.board-r h3{font-size:1.1rem;margin-bottom:4px}
.board-r p{margin:0;color:#B8CBD8;font-size:.95rem}
.split{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(28px,5vw,64px);align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}

/* news list */
.news{border-top:2px solid var(--ink)}
.news a{display:grid;grid-template-columns:120px 1fr auto;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:baseline}
.news a:hover h3{text-decoration:underline;text-underline-offset:4px}
.news time{font-weight:600;color:var(--muted);font-size:.92rem}
.news p{margin:.2em 0 0;color:var(--ink-2);font-size:.98rem}
@media (max-width:640px){.news a{grid-template-columns:1fr}.news .tag{justify-self:start}}

/* place */
.place{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.place-map{background:var(--pool);min-height:280px;position:relative}
.place-in{padding:clamp(22px,4vw,40px)}
.place-in dl{margin:18px 0 0;display:grid;gap:14px}
.place-in dt{font-size:.85rem;font-weight:600;color:var(--muted)}
.place-in dd{margin:0;font-weight:500}
@media (max-width:820px){.place{grid-template-columns:1fr}}

/* footer */
.foot{background:#0B1C2C;color:#CFE0EA;padding-top:0;margin-top:0}
.foot .rope{height:10px}
.foot-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding-block:44px}
.foot h4{margin:0 0 12px;font-size:.95rem;color:#fff}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a{text-decoration:none;color:#CFE0EA}
.foot a:hover{color:#fff;text-decoration:underline}
.foot-b{border-top:1px solid rgba(255,255,255,.1);padding-block:18px;font-size:.88rem;color:#93A8B9;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:820px){.foot-g{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot-g{grid-template-columns:1fr}}

/* page head */
.ph{background:var(--deck);padding-block:clamp(40px,6vw,72px) 32px}
.ph h1{font-size:clamp(2.8rem,8vw,5.6rem);max-width:14ch}
.ph .lead{margin-top:16px}
.crumb{font-size:.9rem;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}

/* steps / levels */
.levels{list-style:none;margin:0;padding:0;counter-reset:lv;display:grid;gap:0;border-top:2px solid var(--ink)}
.levels li{display:grid;grid-template-columns:80px 1fr;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.levels li::before{counter-increment:lv;content:counter(lv);font-family:var(--fd);font-weight:900;font-size:3rem;line-height:.9;color:var(--pool)}
.levels p{margin:0}
.bring{columns:2;column-gap:32px;padding-left:1.1em;margin:0}
.bring li{margin-bottom:8px;break-inside:avoid}
details{border-bottom:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--fd);font-size:1.6rem;line-height:.8}
details[open] summary::after{content:"–"}
details p{color:var(--ink-2)}
.note{font-size:.9rem;color:var(--muted);border-left:3px solid var(--yellow);padding:4px 0 4px 12px;margin-top:20px}

/* staff */
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0;border-top:1px solid var(--line)}
.person{display:flex;gap:14px;align-items:flex-start;padding:18px 12px 18px 0;border-bottom:1px solid var(--line)}
.av{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:1.3rem;color:#fff;background:var(--pool)}
.person:nth-child(3n+2) .av{background:var(--pool-deep)}
.person:nth-child(3n) .av{background:#2E8FBF}
.person h3{font-size:1.02rem;margin:2px 0 4px}
.roles{display:flex;flex-wrap:wrap;gap:4px}

table.t{width:100%;border-collapse:collapse;font-size:.98rem}
.t th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
.t td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.t-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.rv{background:color-mix(in srgb,var(--yellow) 30%,transparent);color:#7A5B00}
.pill.no{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.rv{color:var(--yellow)}}
:root[data-theme="dark"] .pill.rv{color:var(--yellow)}

/* forms */
.form{display:grid;gap:16px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.form-2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-weight:600;font-size:.95rem}
label.f span.h{font-weight:400;color:var(--muted);font-size:.86rem}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:400}
textarea.inp{min-height:110px;resize:vertical}
.inp:focus{border-color:var(--pool);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pool) 25%,transparent)}
.inp[aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red);font-size:.88rem;font-weight:500;min-height:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--pool)}
.warn{background:color-mix(in srgb,var(--yellow) 22%,transparent);border-radius:10px;padding:10px 12px;font-size:.93rem}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(6,20,32,.55)}
.modal.open{display:flex}
.dialog{background:var(--bg);width:min(680px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;border-radius:22px 22px 0 0;padding:20px var(--gut) calc(env(safe-area-inset-bottom,0px) + 24px)}
@media (min-width:720px){.modal{align-items:center}.dialog{border-radius:22px;max-height:88vh;padding:28px 34px}}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.dlg-top h2{font-size:clamp(1.9rem,5vw,2.6rem)}
.x{border:0;background:var(--deck);width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.stepper{display:flex;gap:6px;margin:14px 0 22px;list-style:none;padding:0}
.stepper li{flex:1;font-size:.8rem;font-weight:600;color:var(--muted)}
.stepper li::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
.stepper li.on{color:var(--ink)}
.stepper li.on::before{background:var(--pool)}
.stepper li.done::before{background:var(--ink-2)}
.dlg-actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.sumbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dates span{font-size:.82rem;padding:3px 8px;border-radius:6px;background:var(--deck)}
.dates span.past{opacity:.45;text-decoration:line-through}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font-weight:600;background:var(--surface)}
.pay label:has(input:checked){border-color:var(--pool);box-shadow:0 0 0 3px color-mix(in srgb,var(--pool) 20%,transparent)}
.pay input{accent-color:var(--pool);width:18px;height:18px}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;margin-bottom:14px}

/* toast + cookie + mobile bar */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:90;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:none}
.toast.show{display:block}
.cookie{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 12px 40px rgba(6,20,32,.18);display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:760px;margin:0 auto}
.cookie p{margin:0;flex:1 1 320px;font-size:.95rem}
.mbar{display:none}
@media (max-width:1060px){
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;padding:10px var(--gut) calc(env(safe-area-inset-bottom,0px) + 10px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .mbar .btn{flex:1}
  body{padding-bottom:72px}
}
.proto{background:var(--yellow);color:#10243A;font-size:.85rem;font-weight:600;text-align:center;padding:6px 12px}

/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:70vh;border-top:1px solid var(--line)}
.adm-side{border-right:1px solid var(--line);padding:22px 16px;background:var(--surface)}
.adm-side button{display:flex;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--ink-2);min-height:44px;align-items:center}
.adm-side button[aria-pressed="true"]{background:var(--deck);color:var(--ink);box-shadow:inset 3px 0 0 var(--red)}
.adm-main{padding:clamp(18px,3vw,34px);min-width:0}
.adm>*,.adm-grid>*,.split>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 28px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi:first-child{border-radius:14px 14px 14px 4px}
.kpi b{font-family:var(--fd);font-weight:900;font-size:2.4rem;line-height:1;display:block}
.kpi span{font-size:.9rem;color:var(--muted);font-weight:500}
.adm-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel h3{margin-bottom:12px}
.occ{display:grid;gap:14px}
.occ-row{display:grid;grid-template-columns:140px 1fr 56px;gap:12px;align-items:center;font-size:.93rem}
.bar{height:12px;background:var(--deck);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--yellow) 10px 20px)}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.alert:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex-shrink:0;background:var(--red)}
.dot.y{background:var(--yellow)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;min-height:38px}
.tabs button[aria-pressed="true"]{background:var(--pool);border-color:var(--pool);color:#fff}
@media (max-width:980px){.adm{grid-template-columns:1fr}.adm-side{display:flex;overflow-x:auto;gap:6px;border-right:0;border-bottom:1px solid var(--line);padding:10px var(--gut)}.adm-side button{width:auto;white-space:nowrap}.adm-side h4{display:none}.adm-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.occ-row{grid-template-columns:96px 1fr 44px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function holidays(y){const e=easter(y),add=n=>new Date(e.getFullYear(),e.getMonth(),e.getDate()+n);return [new Date(y,0,1),new Date(y,0,6),add(1),new Date(y,3,25),new Date(y,4,1),add(50),new Date(y,5,2),new Date(y,7,15),new Date(y,10,1),new Date(y,11,8),new Date(y,11,25),new Date(y,11,26)].map(d=>d.toDateString());}
function genDates(start,n){const out=[],skip=[];let d=new Date(start);let guard=0;while(out.length<n&&guard<80){guard++;(holidays(d.getFullYear()).includes(d.toDateString())?skip:out).push(new Date(d));d.setDate(d.getDate()+7);}return {out,skip};}
function checks(){
  const seen = new Set(), out = [];
  COURSES.forEach(c => c.dates.forEach(md => { const d = dObj(md); if (d.getDay()!==c.day) { const k = c.lane+c.day+md; if (!seen.has(k)) { seen.add(k); out.push(t("chk_date",{c:`${tr(c.name)} (${dayName(c.day)})`, d:fmtD(d), w:dayName(c.day)})); } } }));
  return out;
}

      ${B.wait?`<p class="warn" style="margin-top:16px">${t("wait_note")}</p>`:`<p style="margin-top:16px;font-size:1.1rem">${t("b_total")}: <b class="tnum">${eur(bPrice())}</b></p>`}`;
  } else if (B.step===2) {
    const age = ageWarn();
    body = `<div class="form"><div class="form-2">${field("first",t("b_first"),"text",'autocomplete="given-name"')}${field("last",t("b_last"),"text",'autocomplete="family-name"')}</div>
      ${field("birth",t("b_birth"),"date")}${age?`<p class="warn">${age}</p>`:""}
      <label class="f">${t("b_level")}<select class="inp" name="level">${["","lvl1","lvl2","lvl3","lvl4"].map(k=>`<option value="${k}" ${B.d.level===k?"selected":""}>${k?t(k):"–"}</option>`).join("")}</select></label>
      <label class="f">${t("b_notes")}<span class="h">${t("b_notes_h")}</span><textarea class="inp" name="notes">${esc(B.d.notes||"")}</textarea></label></div>`;
  } else if (B.step===3) {
    body = `<div class="form">${field("payer",t("b_payer"),"text",'autocomplete="name"')}<div class="form-2">${field("email",t("b_email"),"email",'autocomplete="email"')}${field("tel",t("b_tel"),"tel",'autocomplete="tel"')}</div>
      <label class="f">${t("b_lang")}<select class="inp" name="lang">${["it","de","en"].map(l=>`<option value="${l}" ${B.d.lang===l?"selected":""}>${I18N[l]._name}</option>`).join("")}</select></label>
      <label class="check"><input type="checkbox" name="priv" ${B.d.priv?"checked":""}><span>${t("b_priv")}</span></label>${B.err.priv?`<span class="err">${B.err.priv}</span>`:""}
      <label class="check"><input type="checkbox" name="photo" ${B.d.photo?"checked":""}><span>${t("b_photo")}</span></label></div>`;
  } else if (B.step===4) {
    body = `<p style="font-weight:600;margin-bottom:10px">${t("b_pay")}</p><div class="pay" role="radiogroup">${["card","pp","sp","bt"].map(p=>`<label><input type="radio" name="pay" value="${p}" ${B.d.pay===p?"checked":""}>${t("pay_"+(p==="card"?"card":p))}</label>`).join("")}</div>
      <div class="sumbox" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px"><span>${esc(tr(c.name))}<br><span class="muted">${esc(B.d.first)} ${esc(B.d.last)}</span></span><b class="c-price tnum">${eur(bPrice())}</b></div>`;
  }
  const last = B.step===steps.length;
  const nextLbl = last ? (B.wait?t("join_wait"):t("pay_now")) : t("next");
  $("#dlg").innerHTML = `<div class="dlg-top"><h2 id="dlgT" tabindex="-1">${B.wait?t("waitlist"):t("b_title")}</h2><button class="x" type="button" data-act="closemodal" aria-label="${t("close")}">${IC.x}</button></div>${stepper}${body}
    <div class="dlg-actions">${B.step>1?`<button class="btn btn-line" type="button" data-act="bback">${t("back")}</button>`:"<span></span>"}<button class="btn ${B.wait&&last?"btn-wait":"btn-go"}" type="button" data-act="bnext">${nextLbl}</button></div>`;
  const inv = $("#dlg [aria-invalid='true']"); (inv||$("#dlgT")).focus();
}
function ageWarn(){
  const B=S.b, c=B.c; if (!c.ages || !B.d.birth) return "";
  const b = new Date(B.d.birth), ref = c.dates.length ? dObj(c.dates[0]) : today; if (isNaN(b)) return "";
  let a = ref.getFullYear()-b.getFullYear(); if (ref < new Date(ref.getFullYear(), b.getMonth(), b.getDate())) a--;
  return (a < c.ages[0] || a > c.ages[1]) ? t("age_warn",{a:tr(c.age)}) : "";
}
function validate(){
  const B=S.b, d=B.d, e={};
  if (B.step===2) { ["first","last","birth"].forEach(k=>{ if(!String(d[k]||"").trim()) e[k]=t("req"); }); }
  if (B.step===3) { if(!String(d.payer||"").trim()) e.payer=t("req"); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email||"")) e.email=t("bad_email"); if(!String(d.tel||"").trim()) e.tel=t("req"); if(!d.priv) e.priv=t("req"); }
  B.err = e; return !Object.keys(e).length;
}

/* ---------- modal + toast ---------- */
let lastFocus = null;
function openModal(){ lastFocus = document.activeElement; $("#modal").classList.add("open"); document.body.style.overflow="hidden"; }
function closeModal(){ $("#modal").classList.remove("open"); document.body.style.overflow=""; S.b=null; if (lastFocus) lastFocus.focus(); }
function famModal(){ openModal(); $("#dlg").innerHTML = `<div class="dlg-top"><h2 id="dlgT" tabindex="-1">${t("fam_t")}</h2><button class="x" type="button" data-act="closemodal" aria-label="${t("close")}">${IC.x}</button></div><p class="lead">${t("fam_p")}</p><ul>${[1,2,3,4].map(i=>`<li style="margin-bottom:8px">${t("fam_"+i)}</li>`).join("")}</ul><div class="dlg-actions"><span></span><button class="btn btn-go" type="button" data-act="closemodal">${t("fam_ok")}</button></div>`; $("#dlgT").focus(); }
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),3800); }

/* ---------- render ---------- */
const TITLES = {home:"hero_h1",courses:"courses_h1",school:"school_h1",team:"team_h1",club:"club_h1",news:"news_h1",contact:"contact_h1",admin:"a_title"};
function render(){
  parse(); store.set("avi-lang", S.lang);
  document.documentElement.lang = S.lang;
  header(); $("#main").innerHTML = (P[S.route]||P.home)(); footer();
  document.title = (S.route==="home" ? "Polisportiva A.V.I. – " + t("fact1") : t(TITLES[S.route]) + " – Polisportiva A.V.I.");
  cookie();
}
function cookie(){
  const el = $("#cookie");
  if (store.get("avi-cookie")) { el.innerHTML=""; return; }
  el.innerHTML = `<div class="cookie" role="region" aria-label="Cookie"><p>${t("cookie_t")}</p><button class="btn btn-line btn-sm" type="button" data-act="ck">${t("cookie_no")}</button><button class="btn btn-go btn-sm" type="button" data-act="ck">${t("cookie_ok")}</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-lang],[data-act],[data-book],[data-f],[data-staff],[data-news],[data-tab],[data-ml]"); if (!el) return;
  if (el.dataset.lang) { const nl = el.dataset.lang; const key = S.route; S.lang = nl; store.set("avi-lang", nl); const q = location.hash.split("?")[1]; go("#/"+nl+"/"+SLUGS[nl][key]+(q?"?"+q:"")); return; }
  if (el.dataset.book) { openBooking(el.dataset.book); return; }
  if (el.dataset.f) { const q = {...S.q, [el.dataset.f]: el.dataset.v}; Object.keys(q).forEach(k=>q[k]==="all"&&delete q[k]); go(href("courses", Object.keys(q).length?q:undefined)); return; }
  if (el.dataset.staff) { S.staffF = el.dataset.staff; $("#main").innerHTML = P.club(); return; }
  if (el.dataset.news) { S.newsF = el.dataset.news; $("#main").innerHTML = P.news(); return; }
  if (el.dataset.tab) { S.adm.tab = el.dataset.tab; $("#main").innerHTML = P.admin(); return; }
  if (el.dataset.ml) { S.adm.ml = el.dataset.ml; $("#main").innerHTML = P.admin(); $("#msg").focus(); return; }
  const a = el.dataset.act;
  if (a==="menu") { $("#sheet").classList.add("open"); el.setAttribute("aria-expanded","true"); $("#sheet .x").focus(); }
  if (a==="closemenu") { $("#sheet").classList.remove("open"); }
  if (a==="fam") { $("#sheet").classList.remove("open"); famModal(); }
  if (a==="closemodal") closeModal();
  if (a==="reset") go(href("courses"));
  if (a==="doc") { e.preventDefault(); toast(t("docs_soon")); }
  if (a==="ck") { store.set("avi-cookie","1"); $("#cookie").innerHTML=""; }
  if (a==="cal") toast(t("cal_toast"));
  if (a==="bback") { S.b.step--; S.b.err={}; drawBooking(); }
  if (a==="bnext") { if (!validate()) { drawBooking(); return; } if (S.b.step===bSteps().length) { if (!S.b.wait) S.b.c.booked++; else S.b.c.wait++; S.b.step="done"; } else S.b.step++; drawBooking(); }
  if (a==="dup") toast(t("c_dup_t"));
  if (a==="newcourse") { $("#newc").scrollIntoView({behavior:"smooth",block:"start"}); $("#g_type").focus(); }
  if (a==="gen") { const from=$("#g_from").value||"2027-02-01", n=Math.max(1,Math.min(30,+$("#g_n").value||12)); const [y,m,d]=from.split("-").map(Number); S.adm.gen={from,n,...genDates(new Date(y,m-1,d),n)}; $("#main").innerHTML=P.admin(); }
  if (a==="autotr") { ["it","de","en"].forEach(l=>{ if(!S.adm.msg[l].trim()) S.adm.msg[l]=I18N[l].comm_ex; }); $("#main").innerHTML=P.admin(); toast(t("comm_trd")); }
  if (a==="send") { const g=S.adm.grp; const n = COURSES.filter(c=>!c.voucher && (g==="all" || c.lane+"-"+c.day===g)).reduce((s,c)=>s+c.booked,0); toast(t("comm_sent",{n})); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (S.b && el.closest("#dlg") && el.name) { S.b.d[el.name] = el.type==="checkbox" ? el.checked : el.value; if (el.name==="persons") drawBooking(); if (el.name==="birth" && S.b.step===2) { const w=ageWarn(), cur=$("#dlg .warn"); if (w && !cur) { el.closest("label").insertAdjacentHTML("afterend",`<p class="warn">${w}</p>`); } else if (!w && cur) cur.remove(); } }
  if (el.id==="resq") { S.resQ = el.value; const q=el.value.toLowerCase(); const res=RESULTS.filter(r=>!q||(r.who+" "+tr(r.ev)+" "+tr(r.meet)).toLowerCase().includes(q)); $("#resl").innerHTML = res.length?board(res):`<p>${t("none")}</p>`; }
  if (el.id==="msg") S.adm.msg[S.adm.ml] = el.value;
  if (el.id==="grp") S.adm.grp = el.value;
});
document.addEventListener("change", e => { if (e.target.id==="grp") S.adm.grp = e.target.value; if (S.b && e.target.closest("#dlg") && e.target.type==="radio") S.b.d[e.target.name]=e.target.value; });
document.addEventListener("submit", e => {
  if (e.target.id !== "cform") return; e.preventDefault(); const f = e.target, err = $("#cerr");
  const bad = [...f.querySelectorAll("[required]")].filter(x => x.type==="checkbox" ? !x.checked : !x.value.trim() || (x.type==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.value)));
  f.querySelectorAll(".inp").forEach(x=>x.removeAttribute("aria-invalid")); bad.forEach(x=>x.setAttribute("aria-invalid","true"));
  if (bad.length) { err.textContent = t("req"); bad[0].focus(); return; }
  err.textContent = ""; f.reset(); toast(t("sent"));
});
document.addEventListener("keydown", e => { if (e.key==="Escape") { if ($("#modal").classList.contains("open")) closeModal(); $("#sheet").classList.remove("open"); } });
$("#modal").addEventListener("click", e => { if (e.target.id==="modal") closeModal(); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); $("#sheet").classList.remove("open"); });
render();

</script>
</body>
</html>
